# Plan Ecosystem Dashboard - Docker Compose
# Manages the dashboard container with proper volume mounts

services:
  plan-dashboard:
    build: .
    container_name: plan-ecosystem-dashboard
    ports:
      - "7847:7847"
    volumes:
      # Mount data directories - planning-log is read-write for v2.0 logging
      - K:/PortableApps/genai/plans:/data/plans:ro
      - K:/PortableApps/genai/planning-log:/data/planning-log:rw
      - K:/PortableApps/genai/ShrimpData:/data/ShrimpData:ro
      # v2.0: ATOS stats and logs
      - K:/PortableApps/genai/atos:/data/atos:ro
      # v2.0: Unified task system
      - K:/PortableApps/genai/unified-task-system:/data/unified-task-system:ro
      # v2.0 Phase 7: Skills directory
      - K:/PortableApps/genai/.claude/skills:/data/.claude/skills:ro
      # v2.0 Phase 8: Task Master data
      - K:/PortableApps/genai/data:/data/data:ro
      # v4.0 Phase 9 Week 4: MCP Server databases
      - K:/PortableApps/genai/mcp-servers/vibekanban/instance:/data/mcp-servers/vibekanban/instance:ro
      - K:/PortableApps/genai/data/kiro-memory:/data/data/kiro-memory:ro
    environment:
      - NODE_ENV=production
      - BASE_PATH=/data
      - PORT=7847
      # AI Stack Monitor integration - host.docker.internal allows container to reach host
      - AI_STACK_HOST=host.docker.internal
      - AI_STACK_PORT=13579
    extra_hosts:
      # Ensure host.docker.internal works on Linux (already works on Windows/Mac)
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7847/api/stats"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
