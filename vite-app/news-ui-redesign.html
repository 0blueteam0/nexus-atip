<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>News Archive System - Proper Design</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0e27;
            color: #e0e0e0;
        }
        
        /* 전체 화면 활용 */
        .news-container {
            display: grid;
            grid-template-columns: 200px 1fr 300px;
            height: 100vh;
            gap: 1px;
            background: #1a1a2e;
        }
        
        /* 왼쪽: 필터/통계 (좁게) */
        .sidebar-left {
            background: #16213e;
            padding: 20px;
            overflow-y: auto;
        }
        
        .stats-card {
            background: #0f3460;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        
        .stat-item {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
        }
        
        .stat-number {
            font-size: 24px;
            font-weight: bold;
            color: #00d4ff;
        }        /* 중앙: 뉴스 그리드 (메인) */
        .main-content {
            background: #0a0e27;
            padding: 20px;
            overflow-y: auto;
        }
        
        .news-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: #16213e;
            border-radius: 8px;
        }
        
        .view-toggles {
            display: flex;
            gap: 10px;
        }
        
        .view-btn {
            padding: 8px 16px;
            background: #0f3460;
            border: none;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .view-btn.active {
            background: #00d4ff;
            color: #000;
        }
        
        /* 뉴스 그리드 레이아웃 */
        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }
